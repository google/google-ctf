CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_INPUT=y
CONFIG_ASSERT=n

CONFIG_PRINTK=y

# No dynamic allocation anywhere: the kernel heap is already gone with
# HEAP_MEM_POOL_SIZE=0, and this removes the libc arena, which defaults to
# "however much SRAM is left over after linking" and would make the memory the
# firmware needs depend on the build.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# The shell is 30 KiB of code for a prompt nothing uses. printk() still goes
# out over RTT without it. Set CONFIG_SHELL=y and CONFIG_SHELL_BACKEND_RTT=y to
# get it back.
CONFIG_SHELL=n

# Memory protection, with the region layout in src/mpu_regions.c: the image is
# mapped read only and the rest of SRAM is mapped non executable. This matters
# most for a RAM image (see ram_image.conf), where without it every byte the
# firmware can write is also a byte it can execute.
CONFIG_ARM_MPU=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
# The RP2350 controller driver logs an "Endpoint 0x%02x busy" error every time
# a class queues a transfer while another one is in flight, which the mass
# storage class does for every single transfer. The queued transfer is started
# as soon as the current one completes, so the message is just noise. Drop this
# line to get the driver's logs (and the noise) back.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# USB mass storage device used to upload the input to replay.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
# No hwinfo: the only user was the USB serial number, and reading the chip's
# identifier out of the flash means executing the Pico HAL's flash routines,
# which live in RAM. See the comment on replayer_sn in src/usb.c.
CONFIG_HWINFO=n

# FAT filesystem on the RAM disk registered by src/trace_storage.c. The disk is
# not described in the devicetree, so its name has to be given to FatFs here.
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="TRACE"
# f_setlabel(), to give the drive a name.
CONFIG_FS_FATFS_EXTRA_NATIVE_API=y
# Read back the names of the files the host creates as they were typed.
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=2

# Formatting and mounting the volume happens on the main thread, and FatFs
# needs more stack than the default.
CONFIG_MAIN_STACK_SIZE=4096

# Task watchdog: one hardware watchdog multiplexed into per-job software
# channels, so that a thread which is legitimately parked forever (the
# storage thread waiting for the host) is not mistaken for a hung one.
# TASK_WDT only selects REBOOT, so the hardware driver has to be asked for
# explicitly.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=500

CONFIG_LED=y
CONFIG_PWM=y

# Check for stack overflows
CONFIG_HW_STACK_PROTECTION=y

# Execute from RAM, secure boot is pointless with XIP because the QSPI bus
# is exposed and unauthenticated.
CONFIG_XIP=n

# CONFIG_REPLAYER_DEBUG_IMAGE is not set

# Don't build unsigned UF2s
CONFIG_BUILD_OUTPUT_UF2=n

CONFIG_ENTROPY_GENERATOR=y
CONFIG_STACK_CANARIES=y
CONFIG_STACK_CANARIES_STRONG=y
CONFIG_FORTIFY_SOURCE_RUN_TIME=y